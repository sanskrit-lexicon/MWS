<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="210" viewBox="0 0 660 210" role="img" aria-label="How a correction travels: printed dictionary to web display and back">
  <rect width="660" height="210" fill="#ffffff"/>
  <text x="12" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827">How a correction travels</text>

  <!-- Row of stages -->
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- 1 printed scan -->
    <rect x="12" y="44" width="108" height="58" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="66" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Printed dict.</text>
    <text x="66" y="84" text-anchor="middle" font-size="10" fill="#6b7280">1899 edition,</text>
    <text x="66" y="96" text-anchor="middle" font-size="10" fill="#6b7280">page scans</text>

    <!-- 2 canonical source -->
    <rect x="146" y="44" width="108" height="58" rx="6" fill="#eff6ff" stroke="#0f4c81" stroke-width="1.5"/>
    <text x="200" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f4c81">csl-orig</text>
    <text x="200" y="84" text-anchor="middle" font-size="10" fill="#374151">v02/&lt;dict&gt;.txt</text>
    <text x="200" y="96" text-anchor="middle" font-size="10" fill="#374151">canonical source</text>

    <!-- 3 generated xml -->
    <rect x="280" y="44" width="108" height="58" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="334" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Generated XML</text>
    <text x="334" y="84" text-anchor="middle" font-size="10" fill="#6b7280">csl-pywork</text>
    <text x="334" y="96" text-anchor="middle" font-size="10" fill="#6b7280">build + validation</text>

    <!-- 4 web + api -->
    <rect x="414" y="44" width="108" height="58" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="468" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Web + API</text>
    <text x="468" y="84" text-anchor="middle" font-size="10" fill="#6b7280">Cologne display,</text>
    <text x="468" y="96" text-anchor="middle" font-size="10" fill="#6b7280">downloads, apps</text>

    <!-- 5 corrections -->
    <rect x="548" y="44" width="100" height="58" rx="6" fill="#eff6ff" stroke="#0f4c81" stroke-width="1.5"/>
    <text x="598" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f4c81">Corrections</text>
    <text x="598" y="84" text-anchor="middle" font-size="10" fill="#374151">change files,</text>
    <text x="598" y="96" text-anchor="middle" font-size="10" fill="#374151">monthly batch</text>

    <!-- forward arrows -->
    <g stroke="#6b7280" stroke-width="1.5" fill="#6b7280">
      <line x1="120" y1="73" x2="138" y2="73"/><path d="M138 69 L146 73 L138 77 Z"/>
      <line x1="254" y1="73" x2="272" y2="73"/><path d="M272 69 L280 73 L272 77 Z"/>
      <line x1="388" y1="73" x2="406" y2="73"/><path d="M406 69 L414 73 L406 77 Z"/>
      <line x1="522" y1="73" x2="540" y2="73"/><path d="M540 69 L548 73 L540 77 Z"/>
    </g>

    <!-- loop back: corrections -> csl-orig -->
    <path d="M598 102 C598 150 200 150 200 102" fill="none" stroke="#0f4c81" stroke-width="1.5" stroke-dasharray="5 3"/>
    <path d="M196 110 L200 102 L204 110 Z" fill="#0f4c81"/>
    <text x="399" y="158" text-anchor="middle" font-size="10" fill="#0f4c81">applied to the source with an audit trail, then everything downstream is regenerated</text>

    <!-- you are here -->
    <text x="598" y="36" text-anchor="middle" font-size="10" fill="#6b7280">you start here</text>
    <path d="M598 38 L598 44" stroke="#6b7280" stroke-width="1"/>
    <text x="66" y="180" font-size="10" fill="#6b7280">Reading the digital text against the page scans is how every correction on this loop begins.</text>
    <text x="66" y="196" font-size="10" fill="#6b7280">Sources: sanskrit-lexicon/csl-orig &#183; csl-pywork &#183; csl-corrections &#183; Cologne Digital Sanskrit Lexicon.</text>
  </g>
</svg>
